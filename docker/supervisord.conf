[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/php-fpm.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/php-fpm.err
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/nginx-supervisor.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/nginx-supervisor.err
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work database --sleep=1 --tries=5 --timeout=30
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/queue.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/queue.err
stderr_logfile_maxbytes=0

[program:schedule]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=10
stdout_logfile=/var/log/schedule.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/schedule.err
stderr_logfile_maxbytes=0
